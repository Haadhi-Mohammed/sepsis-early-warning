name: CI/CD

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[api,test]"

    - name: Run tests
      run: pytest -v

  # Pull requests only run the tests; merging to main deploys.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer merge waits instead of cancelling a
    # half-finished CloudFormation update.
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    permissions:
      id-token: write   # request the OIDC token that AWS exchanges for credentials
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Get AWS credentials (OIDC, no stored keys)
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ap-south-1

    - name: Set up Node (CDK CLI)
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: infra/package-lock.json

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: infra/requirements.txt

    - name: Install CDK and infrastructure dependencies
      run: |
        npm ci
        pip install -r requirements.txt

    - name: Deploy stacks
      run: npx cdk deploy --all --require-approval never

    - name: Publish the training pipeline definition
      run: python pipeline/training_pipeline.py upsert
