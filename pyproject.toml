[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sepsis"
version = "2.0.0"
description = "Sepsis early warning: LSTM on hourly ICU vitals (PhysioNet 2019)"
requires-python = ">=3.10"
# torch is installed separately so each environment can pick its build
# (CPU wheel for serving/CI, CUDA or SageMaker container for training).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
api     = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5", "shap>=0.45"]
test    = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = [".", "src"]
